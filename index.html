<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>บันทึกงาน</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1F2A44;
    --muted: #5B6475;
    --line: #06C755;
    --line-press: #05A847;
    --amber: #F2A900;
    --amber-soft: #FFF4D6;
    --surface: #F3F6FA;
    --card: #FFFFFF;
    --border: #DCE2EA;
    --danger: #D14343;
    --radius-lg: 18px;
    --radius-sm: 10px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ink: #E9EDF5; --muted: #A3ACBD; --surface: #121826; --card: #1B2335;
      --border: #2C3650; --amber-soft: #3A3014; --danger: #FF7A7A;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    font-family: "IBM Plex Sans Thai", "Sukhumvit Set", "Noto Sans Thai", system-ui, sans-serif;
    background: var(--surface);
    color: var(--ink);
    font-size: 16px;
    line-height: 1.6;
    padding: 20px 16px calc(32px + env(safe-area-inset-bottom));
  }
  main { max-width: 480px; margin: 0 auto; }

  header { margin-bottom: 18px; }
  h1 { font-size: 26px; font-weight: 600; margin: 0; letter-spacing: -0.01em; }
  .hello { color: var(--muted); margin: 2px 0 0; font-size: 15px; }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 18px;
  }
  label { display: block; font-size: 14px; font-weight: 500; margin: 0 0 6px; }
  .field { margin-bottom: 16px; }
  input, textarea {
    width: 100%;
    font: inherit;
    color: var(--ink);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 11px 12px;
    appearance: none;
  }
  textarea { resize: vertical; min-height: 64px; }
  input:focus, textarea:focus, button:focus-visible {
    outline: 2px solid var(--line);
    outline-offset: 1px;
  }
  .row { display: grid; grid-template-columns: 1.3fr 1fr; gap: 10px; }

  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    font: inherit; font-size: 14px;
    padding: 7px 13px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--ink);
    cursor: pointer;
  }
  .chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--card); }

  /* สลิปแสดงเวลาที่จะเตือน — จุดเด่นของหน้า */
  .slip {
    margin: 18px 0 16px;
    padding: 14px 16px;
    background: var(--amber-soft);
    border-left: 4px solid var(--amber);
    border-radius: 0;
  }
  .slip-label { font-size: 13px; color: var(--muted); margin: 0; }
  .slip-time { font-size: 22px; font-weight: 600; margin: 0; }
  .slip.warn .slip-time { color: var(--danger); font-size: 16px; font-weight: 500; }

  .btn {
    width: 100%;
    font: inherit; font-weight: 600; font-size: 17px;
    padding: 14px;
    border: 0;
    border-radius: 12px;
    background: var(--line);
    color: #fff;
    cursor: pointer;
  }
  .btn:active { background: var(--line-press); }
  .btn[disabled] { opacity: .55; cursor: wait; }
  .error { color: var(--danger); font-size: 13px; margin: 6px 0 0; min-height: 1em; }

  h2 { font-size: 18px; font-weight: 600; margin: 28px 0 10px; }
  .tasks { list-style: none; padding: 0; margin: 0; }
  .task {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 0;
    border-bottom: 1px solid var(--border);
  }
  .task:last-child { border-bottom: 0; }
  .task-main { flex: 1; min-width: 0; }
  .task-title { font-weight: 500; margin: 0; overflow-wrap: anywhere; }
  .task-meta { font-size: 13px; color: var(--muted); margin: 0; }
  .done-btn {
    font: inherit; font-size: 13px;
    padding: 6px 12px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: transparent;
    color: var(--line);
    cursor: pointer;
    white-space: nowrap;
  }
  .empty { color: var(--muted); text-align: center; padding: 18px 0; margin: 0; }

  .toast {
    position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom));
    transform: translate(-50%, 20px);
    background: var(--ink); color: var(--card);
    padding: 10px 18px; border-radius: 999px;
    font-size: 14px; opacity: 0; pointer-events: none;
    transition: opacity .2s, transform .2s;
    max-width: calc(100% - 32px);
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  @media (prefers-reduced-motion: reduce) { .toast { transition: none; } }

  .loading { text-align: center; color: var(--muted); padding: 60px 0; }
</style>
</head>
<body>
<main>
  <div id="loading" class="loading">กำลังเชื่อมต่อ LINE…</div>

  <div id="app" hidden>
    <header>
      <h1>บันทึกงาน</h1>
      <p class="hello" id="hello">เพิ่มงาน แล้วเราจะทักไปเตือนใน LINE</p>
    </header>

    <form class="card" id="taskForm" novalidate>
      <div class="field">
        <label for="title">ชื่องาน</label>
        <input id="title" maxlength="200" placeholder="เช่น ส่งรายงานประจำเดือน" autocomplete="off">
        <p class="error" id="titleError"></p>
      </div>

      <div class="field">
        <label for="detail">รายละเอียด (ไม่บังคับ)</label>
        <textarea id="detail" maxlength="1000" placeholder="สิ่งที่ต้องเตรียม, ลิงก์, ผู้เกี่ยวข้อง"></textarea>
      </div>

      <div class="field">
        <div class="row">
          <div>
            <label for="dueDate">วันที่กำหนด</label>
            <input id="dueDate" type="date">
          </div>
          <div>
            <label for="dueTime">เวลา</label>
            <input id="dueTime" type="time">
          </div>
        </div>
        <p class="error" id="dueError"></p>
      </div>

      <div class="field" style="margin-bottom:0">
        <label id="remindLabel">เตือนล่วงหน้า</label>
        <div class="chips" role="group" aria-labelledby="remindLabel" id="chips">
          <button type="button" class="chip" data-min="0">ตรงเวลา</button>
          <button type="button" class="chip" data-min="15">15 นาที</button>
          <button type="button" class="chip" data-min="30" aria-pressed="true">30 นาที</button>
          <button type="button" class="chip" data-min="60">1 ชั่วโมง</button>
          <button type="button" class="chip" data-min="180">3 ชั่วโมง</button>
          <button type="button" class="chip" data-min="1440">1 วัน</button>
        </div>
      </div>

      <div class="slip" id="slip" aria-live="polite">
        <p class="slip-label">จะเตือนคุณใน LINE</p>
        <p class="slip-time" id="slipTime">–</p>
      </div>

      <button class="btn" id="saveBtn" type="submit">บันทึกงาน</button>
      <p class="error" id="formError"></p>
    </form>

    <h2>งานที่ยังค้าง</h2>
    <div class="card" style="padding: 4px 18px">
      <ul class="tasks" id="taskList"><li class="empty">กำลังโหลด…</li></ul>
    </div>
  </div>
</main>

<div class="toast" id="toast" role="status"></div>

<script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script>
/* ===== ตั้งค่า: แก้ 2 บรรทัดนี้ ===== */
const LIFF_ID = "2011622939-JQFpvGzY";
const GAS_URL = "วาง_URL_exec_ของคุณตรงนี้";
/* =================================== */

const $ = (id) => document.getElementById(id);
let remindBefore = 30;

const fmtThai = new Intl.DateTimeFormat("th-TH", {
  weekday: "short", day: "numeric", month: "short",
  hour: "2-digit", minute: "2-digit",
});

function escapeHtml(s) {
  return String(s ?? "").replace(/[&<>"']/g, (c) =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function toast(msg) {
  const t = $("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toast._t);
  toast._t = setTimeout(() => t.classList.remove("show"), 2600);
}

/* เรียก Apps Script: ไม่ตั้ง Content-Type เพื่อให้เป็น simple request (ไม่มี CORS preflight) */
async function api(action, data = {}) {
  const res = await fetch(GAS_URL, {
    method: "POST",
    body: JSON.stringify({ action, idToken: liff.getIDToken(), ...data }),
  });
  const json = await res.json();
  if (!json.ok) throw new Error(json.error || "เกิดข้อผิดพลาด");
  return json;
}

function getDueDate() {
  const d = $("dueDate").value, t = $("dueTime").value;
  if (!d || !t) return null;
  const dt = new Date(`${d}T${t}`); // เวลาท้องถิ่นของเครื่องผู้ใช้
  return isNaN(dt) ? null : dt;
}

function updateSlip() {
  const due = getDueDate();
  const slip = $("slip");
  slip.classList.remove("warn");
  if (!due) { $("slipTime").textContent = "เลือกวันและเวลาก่อน"; return; }
  const remindAt = new Date(due.getTime() - remindBefore * 60000);
  if (due <= new Date()) {
    slip.classList.add("warn");
    $("slipTime").textContent = "เวลากำหนดผ่านไปแล้ว เลือกเวลาในอนาคต";
  } else if (remindAt <= new Date()) {
    slip.classList.add("warn");
    $("slipTime").textContent = "เวลาเตือนผ่านไปแล้ว ระบบจะเตือนทันทีหลังบันทึก";
  } else {
    $("slipTime").textContent = fmtThai.format(remindAt) + " น.";
  }
}

function setDefaults() {
  const d = new Date(Date.now() + 2 * 3600000);
  d.setMinutes(0, 0, 0);
  const pad = (n) => String(n).padStart(2, "0");
  $("dueDate").value = `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  $("dueTime").value = `${pad(d.getHours())}:00`;
  updateSlip();
}

function renderTasks(tasks) {
  const ul = $("taskList");
  if (!tasks.length) {
    ul.innerHTML = '<li class="empty">ยังไม่มีงานค้าง เพิ่มงานแรกได้จากฟอร์มด้านบน</li>';
    return;
  }
  ul.innerHTML = tasks.map((t) => `
    <li class="task">
      <div class="task-main">
        <p class="task-title">${escapeHtml(t.title)}</p>
        <p class="task-meta">กำหนด ${escapeHtml(t.dueAt)}${t.sent ? " · เตือนแล้ว" : ""}</p>
      </div>
      <button class="done-btn" data-id="${escapeHtml(t.id)}">เสร็จแล้ว</button>
    </li>`).join("");
}

async function loadTasks() {
  try {
    const { tasks } = await api("listTasks");
    renderTasks(tasks);
  } catch (e) {
    $("taskList").innerHTML = `<li class="empty">โหลดรายการไม่สำเร็จ: ${escapeHtml(e.message)}</li>`;
  }
}

/* ===== events ===== */
$("chips").addEventListener("click", (e) => {
  const chip = e.target.closest(".chip");
  if (!chip) return;
  document.querySelectorAll(".chip").forEach((c) => c.setAttribute("aria-pressed", "false"));
  chip.setAttribute("aria-pressed", "true");
  remindBefore = Number(chip.dataset.min);
  updateSlip();
});
["dueDate", "dueTime"].forEach((id) => $(id).addEventListener("input", () => {
  $("dueError").textContent = "";
  updateSlip();
}));
$("title").addEventListener("input", () => { $("titleError").textContent = ""; });

$("taskForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  $("formError").textContent = "";
  const title = $("title").value.trim();
  const due = getDueDate();
  let valid = true;
  if (!title) { $("titleError").textContent = "ใส่ชื่องานก่อนบันทึก"; valid = false; }
  if (!due) { $("dueError").textContent = "เลือกวันและเวลากำหนด"; valid = false; }
  else if (due <= new Date()) { $("dueError").textContent = "กำหนดเวลาต้องอยู่ในอนาคต"; valid = false; }
  if (!valid) return;

  const btn = $("saveBtn");
  btn.disabled = true;
  btn.textContent = "กำลังบันทึก…";
  try {
    const { task } = await api("addTask", {
      title,
      detail: $("detail").value.trim(),
      dueAt: due.toISOString(),
      remindBefore,
    });
    toast(`บันทึกงานแล้ว จะเตือน ${task.remindAt}`);
    $("title").value = "";
    $("detail").value = "";
    setDefaults();
    loadTasks();
  } catch (err) {
    $("formError").textContent = err.message;
  } finally {
    btn.disabled = false;
    btn.textContent = "บันทึกงาน";
  }
});

$("taskList").addEventListener("click", async (e) => {
  const btn = e.target.closest(".done-btn");
  if (!btn) return;
  btn.disabled = true;
  btn.textContent = "…";
  try {
    await api("doneTask", { id: btn.dataset.id });
    toast("ปิดงานแล้ว");
    loadTasks();
  } catch (err) {
    toast(err.message);
    btn.disabled = false;
    btn.textContent = "เสร็จแล้ว";
  }
});

/* ===== start ===== */
(async function init() {
  try {
    await liff.init({ liffId: LIFF_ID });
    if (!liff.isLoggedIn()) { liff.login(); return; }
    try {
      const p = await liff.getProfile();
      $("hello").textContent = `สวัสดี ${p.displayName} เพิ่มงานแล้วเราจะทักไปเตือนใน LINE`;
    } catch (_) { /* ไม่มี scope profile ก็ใช้ข้อความเดิม */ }
    $("loading").hidden = true;
    $("app").hidden = false;
    setDefaults();
    loadTasks();
  } catch (err) {
    $("loading").textContent = "เชื่อมต่อ LINE ไม่สำเร็จ: " + err.message +
      " — ตรวจสอบ LIFF_ID และ Endpoint URL";
  }
})();
</script>
</body>
</html>
